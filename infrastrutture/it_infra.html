<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servizi</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS personalizzato -->
    <style>
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #eb6600 0%, transparent 70%);
      filter: blur(120px);
      opacity: 0.4;
      z-index: -1;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }
        /* Elementi riutilizzabili */
        .service-circle {
            transition: transform 0.25s ease;
        }

        .service-circle:hover {
            transform: scale(1.05);
        }

        .service-summary {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .service-circle:hover .service-summary {
            opacity: 1;
        }

        .modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body class="min-h-screen bg-[#535260] text-white overflow-x-hidden fade-up">

    <!-- GLOW BACKGROUND -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="glow top-0 left-0"></div>
    <div class="glow bottom-0 right-0"></div>
  </div>
  
    <img src="../assets/omniaBuildLogo.png" alt="OmniaBuild Logo" class="mx-auto mb-0">
  
    <!--
        ========================================
        SERVIZI
        ========================================
    -->

    <main class="min-h-screen flex items-center justify-center  m-o">

        <div class="w-full max-w-5xl">

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-8 justify-items-center">

                <!-- SERVIZIO 1 -->
                <button
                    class="service-circle service-item relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-red-400 flex items-center justify-center p-5 text-center cursor-pointer"
                    data-service="0">

                    <span class="service-title font-bold text-lg">
                        Servizio 1
                    </span>

                    <span
                        class="service-summary absolute inset-0 flex items-center justify-center rounded-full bg-black/70 text-white text-sm p-5">
                        Piccolo riassunto del servizio numero uno.
                    </span>

                </button>


                <!-- SERVIZIO 2 -->
                <button
                    class="service-circle service-item relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-blue-400 flex items-center justify-center p-5 text-center cursor-pointer"
                    data-service="1">

                    <span class="service-title font-bold text-lg">
                        Servizio 2
                    </span>

                    <span
                        class="service-summary absolute inset-0 flex items-center justify-center rounded-full bg-black/70 text-white text-sm p-5">
                        Piccolo riassunto del servizio numero due.
                    </span>

                </button>


                <!-- SERVIZIO 3 -->
                <button
                    class="service-circle service-item relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-green-400 flex items-center justify-center p-5 text-center cursor-pointer"
                    data-service="2">

                    <span class="service-title font-bold text-lg">
                        Servizio 3
                    </span>

                    <span
                        class="service-summary absolute inset-0 flex items-center justify-center rounded-full bg-black/70 text-white text-sm p-5">
                        Piccolo riassunto del servizio numero tre.
                    </span>

                </button>


                <!-- SERVIZIO 4 -->
                <button
                    class="service-circle service-item relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-yellow-400 flex items-center justify-center p-5 text-center cursor-pointer"
                    data-service="3">

                    <span class="service-title font-bold text-lg">
                        Servizio 4
                    </span>

                    <span
                        class="service-summary absolute inset-0 flex items-center justify-center rounded-full bg-black/70 text-white text-sm p-5">
                        Piccolo riassunto del servizio numero quattro.
                    </span>

                </button>


                <!-- SERVIZIO 5 -->
                <button
                    class="service-circle service-item relative w-40 h-40 sm:w-44 sm:h-44 rounded-full bg-purple-400 flex items-center justify-center p-5 text-center cursor-pointer"
                    data-service="4">

                    <span class="service-title font-bold text-lg">
                        Servizio 5
                    </span>

                    <span
                        class="service-summary absolute inset-0 flex items-center justify-center rounded-full bg-black/70 text-white text-sm p-5">
                        Piccolo riassunto del servizio numero cinque.
                    </span>

                </button>

            </div>

        </div>

    </main>


    <!--
        ========================================
        POPUP / MODAL
        ========================================
    -->

    <div
        id="serviceModal"
        class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">

        <div
            id="modalContent"
            class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-xl bg-white p-6 sm:p-8">

            <!-- X -->
            <button
                id="closeModal"
                class="absolute top-4 right-4 text-2xl font-bold leading-none text-gray-500 hover:text-black"
                aria-label="Chiudi">

                &times;

            </button>


            <!-- Titolo -->
            <h2
                id="modalTitle"
                class="text-2xl sm:text-3xl font-bold pr-8 mb-6">
            </h2>


            <!-- Contenuto -->
            <div
                id="modalDescription"
                class="text-gray-700 leading-relaxed">
            </div>

        </div>

    </div>


    <!--
        ========================================
        JAVASCRIPT
        ========================================
    -->

    <script>
    
        document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("body").classList.add("show");
    });

        /*
         * ========================================
         * DATI DEI SERVIZI
         * ========================================
         *
         * Modifica solamente questi testi.
         */

        const services = [

            {
                title: "Servizio 1",

                description: `
                    <p class="mb-4">
                        Inserisci qui la descrizione completa del
                        primo servizio.
                    </p>

                    <p class="mb-4">
                        Puoi aggiungere tutto il testo che vuoi.
                    </p>

                    <h3 class="font-bold text-lg mb-2">
                        Dettagli
                    </h3>

                    <p>
                        Altri dettagli del servizio.
                    </p>
                `
            },

            {
                title: "Servizio 2",

                description: `
                    <p class="mb-4">
                        Inserisci qui la descrizione completa del
                        secondo servizio.
                    </p>

                    <p>
                        Altri dettagli del servizio.
                    </p>
                `
            },

            {
                title: "Servizio 3",

                description: `
                    <p class="mb-4">
                        Inserisci qui la descrizione completa del
                        terzo servizio.
                    </p>

                    <p>
                        Altri dettagli del servizio.
                    </p>
                `
            },

            {
                title: "Servizio 4",

                description: `
                    <p class="mb-4">
                        Inserisci qui la descrizione completa del
                        quarto servizio.
                    </p>

                    <p>
                        Altri dettagli del servizio.
                    </p>
                `
            },

            {
                title: "Servizio 5",

                description: `
                    <p class="mb-4">
                        Inserisci qui la descrizione completa del
                        quinto servizio.
                    </p>

                    <p>
                        Altri dettagli del servizio.
                    </p>
                `
            }

        ];


        /*
         * ========================================
         * ELEMENTI DOM
         * ========================================
         */

        const modal = document.getElementById("serviceModal");
        const modalContent = document.getElementById("modalContent");
        const closeModalButton = document.getElementById("closeModal");

        const modalTitle = document.getElementById("modalTitle");
        const modalDescription = document.getElementById("modalDescription");

        const serviceItems = document.querySelectorAll(".service-item");


        /*
         * ========================================
         * APERTURA POPUP
         * ========================================
         */

        serviceItems.forEach((service) => {

            service.addEventListener("click", () => {

                const serviceIndex = service.dataset.service;
                const selectedService = services[serviceIndex];

                modalTitle.textContent = selectedService.title;
                modalDescription.innerHTML = selectedService.description;

                modal.classList.add("active");

                // Impedisce lo scroll della pagina dietro al popup
                document.body.classList.add("overflow-hidden");

            });

        });


        /*
         * ========================================
         * CHIUSURA POPUP
         * ========================================
         */

        function closeModal() {

            modal.classList.remove("active");

            document.body.classList.remove("overflow-hidden");

        }


        /*
         * Chiusura con X
         */

        closeModalButton.addEventListener("click", closeModal);


        /*
         * Chiusura cliccando fuori dalla finestra
         */

        modal.addEventListener("click", (event) => {

            if (event.target === modal) {
                closeModal();
            }

        });


        /*
         * Chiusura con ESC
         */

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {
                closeModal();
            }

        });

    </script>

</body>

</html>
