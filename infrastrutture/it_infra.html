<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servizi</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS personalizzato -->
    <style>
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #eb6600 0%, transparent 70%);
      filter: blur(120px);
      opacity: 0.4;
      z-index: -1;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }
        /* Elementi riutilizzabili */
        .service-circle {
            transition: transform 0.25s ease;
        }

        .service-circle:hover {
            transform: scale(1.05);
        }

        .service-summary {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .service-circle:hover .service-summary {
            opacity: 1;
        }

        .modal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body class="min-h-screen bg-[#535260] text-white overflow-x-hidden fade-up">

    <!-- GLOW BACKGROUND -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">

  </div>

                    <span

    <!-- FOOTER -->
<footer class="text-center p-6 text-sm text-gray-400 relative z-10">

    <!--
        ========================================
        POPUP / MODAL
        ========================================
    -->

    <div
        id="serviceModal"
        class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">

        <div
            id="modalContent"
            class="relative w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-xl bg-white p-6 sm:p-8">

            <!-- X -->
            <button
                id="closeModal"
                class="absolute top-4 right-4 text-2xl font-bold leading-none text-gray-500 hover:text-black"
                aria-label="Chiudi">

                &times;

            </button>


            <!-- Titolo -->
            <h2
                id="modalTitle"
                class="text-2xl text-gray-700 sm:text-3xl font-bold pr-8 mb-6">
            </h2>

            <!-- Contenuto -->
            <div
                id="modalDescription"
                class="text-gray-700 leading-relaxed">
            </div>

        </div>

    </div>


    <!--
        ========================================
        JAVASCRIPT
        ========================================
    -->

    <script>
    
        document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("body").classList.add("show");
    });

        /*
         * ========================================
         * DATI DEI SERVIZI
         * ========================================
         *
         * Modifica solamente questi testi.
         */

        const services = [

            {

            {
                title: "Edilizia Civile",

                description: `
                    <p class="mb-4">OMNIABUILD opera sia in Italia che all’estero.
                Siamo attivi nel campo dell’edilizia pubblica e privata, realizzando edifici e

                    <p>Ogni progetto viene seguito con attenzione alle esigenze del cliente,

            },
        ];


        /*
         * ========================================
         * ELEMENTI DOM
         * ========================================
         */

        const modal = document.getElementById("serviceModal");
        const modalContent = document.getElementById("modalContent");
        const closeModalButton = document.getElementById("closeModal");

        const modalTitle = document.getElementById("modalTitle");
        const modalDescription = document.getElementById("modalDescription");

        const serviceItems = document.querySelectorAll(".service-item");


        /*
         * ========================================
         * APERTURA POPUP
         * ========================================
         */

        serviceItems.forEach((service) => {

            service.addEventListener("click", () => {

                const serviceIndex = service.dataset.service;
                const selectedService = services[serviceIndex];

                modalTitle.textContent = selectedService.title;
                modalDescription.innerHTML = selectedService.description;

                modal.classList.add("active");

                // Impedisce lo scroll della pagina dietro al popup
                document.body.classList.add("overflow-hidden");

            });

        });


        /*
         * ========================================
         * CHIUSURA POPUP
         * ========================================
         */

        function closeModal() {

            modal.classList.remove("active");

            document.body.classList.remove("overflow-hidden");

        }


        /*
         * Chiusura con X
         */

        closeModalButton.addEventListener("click", closeModal);


        /*
         * Chiusura cliccando fuori dalla finestra
         */

        modal.addEventListener("click", (event) => {

            if (event.target === modal) {
                closeModal();
            }

        });


        /*
         * Chiusura con ESC
         */

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {
                closeModal();
            }

        });

    </script>

</body>
