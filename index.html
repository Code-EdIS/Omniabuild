<!DOCTYPE html>
<html lang="it" class="scroll-smooth overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniaBuild</title>
  <link rel="icon" href="../assets/omniaBuildLogo.png">
  <link rel="apple-touch-icon" href="../assets/omniaBuildLogo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="../js/main.js"></script>

  <style>
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #eb6600 0%, transparent 70%);
      filter: blur(120px);
      opacity: 0.4;
      z-index: -1;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    .fade-up.show {
      opacity: 1;
      transform: translateY(0);
    }

    .split-section {
      width: 100%;
      height: 50vh;
      display: flex;
      overflow: hidden;
      padding: 1rem 2rem;
      gap: 1rem;
    }

    .split-item {
      position: relative;
      width: 50%;
      height: 100%;
      overflow: hidden;
      border-radius: 2rem;

      transition: width 0.6s ease;
    }

    .split-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition:
        transform 0.6s ease,
        filter 0.6s ease;
    }

    .split-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.2);

      transition: background 0.6s ease;
    }

    .split-overlay h2 {
      color: white;
      font-size: 2rem;
      font-weight: bold;

      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);

      transition:
        transform 0.6s ease,
        font-size 0.6s ease;
    }


    /* HOVER INFORMATICA */

    .split-section:has(.split-item:first-child:hover) .split-item:first-child {
      width: 75%;
    }

    .split-section:has(.split-item:first-child:hover) .split-item:nth-child(2) {
      width: 25%;
    }


    /* HOVER INFRASTRUTTURE */

    .split-section:has(.split-item:nth-child(2):hover) .split-item:first-child {
      width: 25%;
    }

    .split-section:has(.split-item:nth-child(2):hover) .split-item:nth-child(2) {
      width: 75%;
    }


    /* EFFETTO IMMAGINE */

    .split-item:hover img {
      transform: scale(1.05);
      filter: brightness(0.75);
    }

    .split-item:hover .split-overlay {
      background: rgba(0, 0, 0, 0.4);
    }

    .split-item:hover .split-overlay h2 {
      transform: scale(1.15);
    }

  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("#pageContent").classList.add("show");
    });
  </script>
</head>

<body class="bg-[#535260] text-white overflow-x-hidden">

  <div id="pageContent" class="fade-up">

    <!-- GLOW BACKGROUND -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
      <div class="glow top-0 left-0"></div>
      <div class="glow bottom-0 right-0"></div>
    </div>

    <img src="./assets/omniaBuildLogo.png" alt="OmniaBuild Logo" class="mx-auto mb-0">

    <section class="split-section">

    <!-- INFORMATICA -->
    <a href="./informatica/it_index.html" class="split-item">
      <img
        src="./assets/immaginePerInformatica.png"
        alt="OmniaBuild sezione informatica"
      >

      <div class="split-overlay">
        <h2>Informatica</h2>
      </div>
    </a>

    <!-- INFRASTRUTTURE -->
    <a href="./infrastrutture/it_infra.html" class="split-item">
      <img
        src="./assets/immaginePerInfrastrutture.png"
        alt="OmniaBuild sezione infrastrutture"
      >

      <div class="split-overlay">
        <h2>Infrastrutture</h2>
      </div>
    </a>

  </section>

  <footer class="text-center px-6 text-sm text-gray-400 relative z-10">
      © 2026 OmniaBuild
      <div class="flex flex-col md:flex-row gap-6 items-center md:items-start justify-between text-center md:text-left p-6 text-sm text-gray-400 relative z-10">
          <p>INDIRIZZO: Via Tirso 26 <br>
              CAP: 00198 ROMA (RM) <br>
              Partita IVA: 17404541009</p>
          <img src="../assets/omniaBuildLogo.png" class="w-40 md:w-60 h-auto">
          <p>Contatti:<br>
              Email: info@omniabuild.net<br>
              PEC: omniabuildsrl@legalmail.it</p>
      </div>
      </footer>

  </div>

</body>
</html>
